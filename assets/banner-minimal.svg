<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Baswaraj Mundkar — Cloud Computing, Web Development and IoT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11100e"/>
      <stop offset="1" stop-color="#181613"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8b8172" stroke-opacity=".075"/>
    </pattern>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d89b4a"/>
      <stop offset="1" stop-color="#d89b4a" stop-opacity=".05"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>

    <!-- engineering frame -->
    <path d="M34 34H1246V326H34Z" fill="none" stroke="#b7ab98" stroke-opacity=".16"/>
    <path d="M34 68H1246" stroke="#b7ab98" stroke-opacity=".10"/>
    <path d="M900 34V326" stroke="#b7ab98" stroke-opacity=".12"/>

    <!-- top instrumentation -->
    <g font-family="monospace" font-size="10" fill="#82786b" letter-spacing="1.5">
      <text x="55" y="55">SYSTEM / PROFILE_INTERFACE</text>
      <text x="1080" y="55">STATUS: ONLINE</text>
      <circle cx="1064" cy="51" r="3" fill="#d89b4a">
        <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="55" y="316">PCCOER / PUNE / INDIA</text>
      <text x="1080" y="316">v01.26</text>
    </g>

    <!-- left content -->
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="72" y="112" fill="#d89b4a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="4">CLOUD · WEB · IoT</text>
      <text x="70" y="166" fill="#f3eee5" font-size="52" font-weight="700" letter-spacing="-2">BASWARAJ</text>
      <text x="70" y="215" fill="#f3eee5" font-size="52" font-weight="700" letter-spacing="-2">MUNDKAR</text>
      <text x="73" y="247" fill="#b9afa0" font-size="17">BCA  ·  CLOUD COMPUTING</text>

      <!-- tiny code/data panel -->
      <rect x="70" y="270" width="360" height="25" fill="#1c1916" stroke="#796f63" stroke-opacity=".22"/>
      <text x="84" y="287" fill="#9b8d7a" font-family="monospace" font-size="10">BUILD  /  DEPLOY  /  CONNECT  /  ITERATE</text>
    </g>

    <!-- technical architecture panel -->
    <g transform="translate(945 82) scale(.72)">
      <!-- vertical labels -->
      <g font-family="monospace" font-size="9" fill="#817669" letter-spacing="1">
        <text x="0" y="12">ARCHITECTURE</text>
        <text x="0" y="202">EDGE</text>
        <text x="152" y="202">CLOUD</text>
        <text x="304" y="202">WEB</text>
      </g>

      <!-- traces -->
      <g fill="none" stroke="url(#trace)" stroke-width="1.5">
        <path d="M35 48V88H165V118"/>
        <path d="M165 48V118"/>
        <path d="M295 48V88H165"/>
        <path d="M165 148V184H35"/>
        <path d="M165 148V184H295"/>
      </g>

      <!-- nodes -->
      <g fill="#181613" stroke="#d89b4a" stroke-width="1.5">
        <rect x="10" y="28" width="50" height="40" rx="4"/>
        <rect x="140" y="28" width="50" height="40" rx="4"/>
        <rect x="270" y="28" width="50" height="40" rx="4"/>
        <rect x="140" y="118" width="50" height="40" rx="4"/>
        <rect x="10" y="178" width="50" height="40" rx="4"/>
        <rect x="270" y="178" width="50" height="40" rx="4"/>
      </g>

      <g font-family="monospace" font-size="9" text-anchor="middle">
        <text x="35" y="51" fill="#d0c5b5">I/O</text>
        <text x="165" y="51" fill="#d0c5b5">API</text>
        <text x="295" y="51" fill="#d0c5b5">WEB</text>
        <text x="165" y="142" fill="#d89b4a">CLOUD</text>
        <text x="35" y="202" fill="#d0c5b5">EDGE</text>
        <text x="295" y="202" fill="#d0c5b5">DATA</text>
      </g>

      <!-- animated signal -->
      <circle cx="35" cy="48" r="3" fill="#d89b4a" filter="url(#softGlow)">
        <animate attributeName="cx" values="35;165;295;165;35" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="48;118;48;118;48" dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- telemetry bars -->
      <g font-family="monospace" font-size="8" fill="#61748a">
        <text x="0" y="245">NET</text>
        <text x="0" y="259">I/O</text>
        <text x="0" y="273">SYNC</text>
      </g>
      <g stroke="#d89b4a" stroke-opacity=".5">
        <path d="M30 243H125"><animate attributeName="x2" values="70;125;92;115;70" dur="4s" repeatCount="indefinite"/></path>
        <path d="M30 257H125"><animate attributeName="x2" values="115;82;125;96;115" dur="3.5s" repeatCount="indefinite"/></path>
        <path d="M30 271H125"><animate attributeName="x2" values="90;120;75;110;90" dur="4.5s" repeatCount="indefinite"/></path>
      </g>
    </g>

    <!-- visible pixel-art tech setup -->
    <g transform="translate(930 228)" shape-rendering="crispEdges">
      <!-- desk -->
      <rect x="0" y="70" width="300" height="5" fill="#796f63"/>
      <rect x="18" y="75" width="5" height="28" fill="#4e463d"/>
      <rect x="277" y="75" width="5" height="28" fill="#4e463d"/>

      <!-- terminal -->
      <rect x="18" y="10" width="100" height="60" fill="#080d13" stroke="#d89b4a" stroke-width="2"/>
      <rect x="27" y="19" width="82" height="40" fill="#07131b"/>
      <rect x="34" y="26" width="31" height="4" fill="#d89b4a"/>
      <rect x="34" y="35" width="58" height="3" fill="#776b5d"/>
      <rect x="34" y="43" width="44" height="3" fill="#776b5d"/>
      <rect x="34" y="51" width="25" height="3" fill="#d89b4a"/>
      <rect x="52" y="70" width="32" height="5" fill="#665a4d"/>

      <!-- IoT board -->
      <rect x="145" y="25" width="76" height="48" fill="#0a1219" stroke="#d89b4a" stroke-width="2"/>
      <rect x="164" y="38" width="38" height="23" fill="#2a241e"/>
      <rect x="174" y="44" width="18" height="11" fill="#d89b4a" opacity=".75"/>
      <rect x="151" y="32" width="6" height="6" fill="#796f63"/>
      <rect x="209" y="32" width="6" height="6" fill="#796f63"/>
      <rect x="151" y="61" width="6" height="6" fill="#796f63"/>
      <rect x="209" y="61" width="6" height="6" fill="#796f63"/>

      <!-- sensor -->
      <rect x="247" y="30" width="32" height="38" fill="#0a1219" stroke="#796f63" stroke-width="2"/>
      <rect x="255" y="37" width="16" height="22" fill="#d89b4a" opacity=".65"/>
      <rect x="260" y="18" width="6" height="12" fill="#796f63"/>
      <circle cx="263" cy="14" r="4" fill="#d89b4a">
        <animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/>
      </circle>

      <!-- animated data path -->
      <path d="M118 39H145" fill="none" stroke="#d89b4a" stroke-width="2"/>
      <path d="M221 49H247" fill="none" stroke="#d89b4a" stroke-width="2"/>
      <rect x="120" y="37" width="6" height="6" fill="#d89b4a">
        <animate attributeName="x" values="120;139;120" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="223" y="47" width="6" height="6" fill="#d89b4a">
        <animate attributeName="x" values="223;241;223" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- scanning line -->
    <rect x="900" y="70" width="1" height="235" fill="#d89b4a" opacity=".35">
      <animate attributeName="y" values="70;305;70" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- outer technical marks -->
    <g stroke="#796f63" stroke-opacity=".3">
      <path d="M24 80H34M24 160H34M24 240H34"/>
      <path d="M1246 80H1256M1246 160H1256M1246 240H1256"/>
      <path d="M120 24V34M240 24V34M360 24V34"/>
    </g>

    <rect x="1" y="1" width="1278" height="358" rx="18" fill="none" stroke="#cbbda9" stroke-opacity=".14"/>
  </g>
</svg>